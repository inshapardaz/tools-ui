name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, production]
    steps:
      - name: Pull latest environment config
        run: git -C ~/code/environment pull --ff-only

      - name: Pull and restart tools
        run: |
          cd ~/code/environment/production
          docker compose pull tools
          docker compose up -d tools
